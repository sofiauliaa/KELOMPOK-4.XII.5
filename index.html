
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Utama Kelompok</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #79c9ff, #d5edff);
    min-height: 100vh;
    text-align: center;
    padding: 35px 15px;
}

h1 {
    color: #07549b;
    margin-bottom: 10px;
}

.subtitle {
    color: #24577e;
    margin-bottom: 30px;
}

.container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 850px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 18px;
    box-shadow: 0 5px 15px #477da655;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-7px);
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 13px;
}

.card a {
    display: block;
    margin-top: 12px;
    color: #07549b;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
}

.card a:hover {
    color: #ff8c42;
}

footer {
    margin-top: 35px;
    color: #24577e;
}

@media (max-width: 600px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .card img {
        height: 145px;
    }
}
</style>
</head>

<body>

<h1>WELCOME TO OUR WEBSITE</h1>
<p class="subtitle">Silakan pilih nama anggota kelompok!</p>

<div class="container">

    <div class="card">
        <img src="1d6b145e-7468-401c-9a56-097c505db8e6.jpeg" alt="Jihan">
        <a href="login.html?nama=Jihan">Jihan</a>
    </div>

    <div class="card">
        <img src="IMG_1361.jpeg" alt="Kania">
        <a href="login.html?nama=Kania">Kania</a>
    </div>

    <div class="card">
        <img src="3f578606-6d1e-483a-b72e-a07cd4659939.jpeg" alt="Sofi">
        <a href="login_sofi.html">Sofi</a>
    </div>

    <div class="card">
        <img src="jika.jpg" alt="Jika">
        <a href="login.html?nama=Jika">Jika</a>
    </div>

    <div class="card">
        <img src="a757a0e0-ea0a-4201-abcd-ce7ebedac8e9.jpeg" alt="Rizki R">
        <a href="login.html?nama=Rizki R">Rizki R</a>
    </div>

    <div class="card">
        <img src="aditia.jpg" alt="M. Aditia">
        <a href="login.html?nama=M. Aditia">M. Aditia</a>
    </div>

</div>

<footer>
    <p>© 2026 Kelompok Kami</p>
</footer>

</body>
</html>
